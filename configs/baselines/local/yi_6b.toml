# Zero-shot local baseline only. No training is performed from this config.
[model]
slug = "yi_6b"
repo_id = "01-ai/Yi-6B"
quantization = "4bit"
trust_remote_code = false

[data]
test_file = "data/character_operations_50k/test.jsonl"
heldout_file = "data/character_operations_50k/heldout.jsonl"

[training]
seed = 20260919

[evaluation]
split = "test"
examples = -1
examples_per_operation = -1
resume = true
max_new_tokens = 192
challenge_file = "data/character_operations_50k/heldout.jsonl"

[output]
results_dir = "results/baselines/local/yi_6b"

[cache]
auto_download = false
cache_dir = ""
revision = "main"
