# ReFT-informed frozen-model intervention preset; see docs/FINAL_TRAINING.md.
[model]
repo_id = "Qwen/Qwen3-8B"
quantization = "4bit"

[data]
train_file = "data/character_operations_150k/train.jsonl"
dev_file = "data/character_operations_150k/dev.jsonl"
test_file = "data/character_operations_150k/test.jsonl"
train_examples = -1
dev_examples = -1
test_examples = -1

[architecture]
layer_index = 5
candidate_layers = [1, 3, 5, 7, 9, 11, 13, 15]
result_dim = 128
gate_dim = 64
max_integer_result = 128
ascii_vocab_size = 128
gate_bias_init = -2.0

[training]
seed = 20260919
epochs = 6
optimizer = "adamw"
learning_rate = 0.001
weight_decay = 0.001
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_epsilon = 0.00000001
per_device_train_batch_size = 8
global_batch_size = 2048
gradient_accumulation_steps = 128
gradient_clip_norm = 1.0
lr_scheduler_type = "linear"
warmup_ratio = 0.06
group_by_length = true
early_stopping_patience = 2
min_delta = 0.0
layer_eval_examples = 2000
max_sequence_length = 512
max_vram_mib = 0

[evaluation]
seed = 20260919
batch_size = 32
max_new_tokens = 128
save_per_example = true
run_layerwise_analysis = false
run_oracle_phase1_analysis = true
challenge_file = "data/character_operations_150k/heldout.jsonl"

[output]
checkpoint_dir = "checkpoints/qwen3_8b/result_injection_150k"
final_checkpoint = "checkpoints/qwen3_8b/result_injection_150k/result_injector.pt"
results_dir = "results/qwen3_8b/result_injection_150k"

[recovery]
heartbeat_seconds = 15
checkpoint_every_optimizer_steps = 25

[cache]
auto_download = true
cache_dir = ""
revision = "b968826d9c46dd6066d109eabc6255188de91218"
